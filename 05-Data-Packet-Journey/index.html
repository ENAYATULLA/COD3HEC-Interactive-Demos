body{display:flex;flex-direction:column;align-items:center;justify-content:center}

#stage{aspect-ratio:16/9;position:relative;overflow:hidden;background:#071525}

#ctl{display:flex;align-items:center;gap:12px;font-size:14px;color:#9fdcff}
button,select{font:inherit;color:#e6fbff;background:#0b2a45;border:1px solid #22d3ee;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover,select:hover{background:#12406a}
button:focus-visible,select:focus-visible,#bar:focus-visible{outline:2px solid #fff;outline-offset:2px}
#bar{position:relative;flex:1;height:12px;background:#12304b;border-radius:6px;cursor:pointer;min-width:60px}
#fill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#3b82f6,#22d3ee);box-shadow:0 0 10px #22d3ee}
.tick{position:absolute;top:-3px;width:2px;height:18px;background:rgba(255,255,255,.28)}
#tm{font-variant-numeric:tabular-nums;min-width:8.6em;text-align:right}
</style>
</head>

var CK=[[0,500,450,1000],[2.4,500,450,1000],[3.3,800,450,900],[8.5,800,450,900],[9.5,1330,450,1500],[13.4,1330,450,1500],[14.4,1650,450,900],[17.9,1650,450,900],[18.5,1450,280,1300],[19.3,300,300,1100],[19.95,200,445,620],[20,200,445,620]];

/* ---------- routing decisions ---------- */
var TP={B:B,C:Q,S:S},TN={B:'ROUTER 2',C:'ROUTER 3',S:'SERVER'};
var EV=[['A',10.0,10.4,0,'B'],['A',10.4,10.8,1,'C'],['A',10.8,11.2,2,'B'],['A',11.2,11.6,3,'S'],['B',12.0,12.3,0,'S'],['B',13.0,13.5,2,'C'],['C',12.5,12.8,1,'S'],['C',14.8,15.1,2,'S']];
function decide(r,t){

  if(!act){[r.l1,r.l2,r.ring,r.ag,r.al,r.ah].forEach(function(e){e.setAttribute('opacity',0)});return}
  var k=Math.min(ss(seg(t,act[1],act[1]+.12)),1-ss(seg(t,act[2]-.1,act[2])));
  var tg=TP[act[4]],dx=tg[0]-r.p[0],dy=tg[1]-r.p[1],n=Math.hypot(dx,dy),ux=dx/n,uy=dy/n;
  var x1=r.p[0]+ux*62,y1=r.p[1]+uy*62,x2=r.p[0]+ux*150,y2=r.p[1]+uy*150,tipx=x2+ux*22,tipy=y2+uy*22;
  [r.ag,r.al].forEach(function(l){l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2)});
  r.al.setAttribute('stroke-dashoffset',-t*70);
  r.ah.setAttribute('points',tipx+','+tipy+' '+(x2-uy*14)+','+(y2+ux*14)+' '+(x2+uy*14)+','+(y2-ux*14));
  r.l2.textContent='P'+(act[3]+1)+' \u2192 '+TN[act[4]];
  op(r.l1,k);op(r.l2,k);op(r.ring,k*.9);op(r.ag,k);op(r.al,k);op(r.ah,k);
}

function render(t){
  camera(t);
  var u=ez(seg(t,.8,3)),cx=lerp(200,730,u),cy=lerp(425,450,u),cs=lerp(.8,1,ss(seg(t,.8,1.5)));

  wcr.setAttribute('height',154*ss(seg(t,19.4,19.95)));op(wp,ss(seg(t,19.35,19.5)));

  var cg=ss(seg(t,12.9,13.4))*(1-ss(seg(t,16.8,17.3)));

  BAYS.forEach(function(b,i){
    var f=DOOR[i]+.5,k=ss(seg(t,f-.1,f+.1));
    b.r.setAttribute('stroke',k>.5?C.gr:'#1e4a6b');b.r.setAttribute('stroke-width',3+2*Math.exp(-Math.pow((t-f)/.25,2)));op(b.ck,k);
  });
  sLeds.forEach(function(l,i){op(l,.3+.7*Math.abs(Math.sin(t*4+i*1.5)))});
  op(panel,ss(seg(t,17.1,17.3))*(1-ss(seg(t,18.0,18.3))));op(recLab,ss(seg(t,17.55,17.8)));
  var pc=resP(t),rs=t<18?lerp(.6,1,ss(seg(t,17.8,18))):1;
  if(t>=19.5)rs=1-ss(seg(t,19.5,19.8));
  cRes.g.setAttribute('transform','translate('+pc[0].toFixed(1)+' '+pc[1].toFixed(1)+') scale('+Math.max(rs,.001).toFixed(3)+')');
  op(cRes.g,t<17.8?0:(t<19.8?ss(seg(t,17.8,18)):0));
  stream(pRes,resP,t,18.0,19.65);
  op(retGuide,.45*fin(t,18.0,19.7));
  hud(t);
}

/* ---------- playback (requestAnimationFrame) ---------- */
var t=0,playing=true,speed=1,last=0;
function label(){pp.innerHTML=playing?'&#10074;&#10074; Pause':'&#9654; Play'}
function frame(now){
  if(!last)last=now;
  var dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){t+=dt*speed;if(t>=DUR){t=DUR;playing=false;label()}render(t)}
  requestAnimationFrame(frame);
}
pp.addEventListener('click',function(){if(t>=DUR){t=0}playing=!playing;label();render(t)});
$('rp').addEventListener('click',function(){t=0;playing=true;label();render(t)});
$('sp').addEventListener('change',function(e){speed=parseFloat(e.target.value)});
function seek(e){var r=bar.getBoundingClientRect();t=cl((e.clientX-r.left)/r.width)*DUR;render(t)}
var drag=false;
bar.addEventListener('pointerdown',function(e){drag=true;if(bar.setPointerCapture)bar.setPointerCapture(e.pointerId);seek(e)});
bar.addEventListener('pointermove',function(e){if(drag)seek(e)});
bar.addEventListener('pointerup',function(){drag=false});
bar.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){t=Math.min(DUR,t+1);render(t)}if(e.key==='ArrowLeft'){t=Math.max(0,t-1);render(t)}});
render(0);label();requestAnimationFrame(frame);
})();
